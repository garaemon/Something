[tools]
xcodegen = "2.46.0"

[env]
# Build into the repository so the run task can find the app at a fixed path.
DERIVED_DATA_PATH = "build"

[tasks.generate]
description = "Generate Something.xcodeproj from project.yml"
run = "xcodegen generate"

[tasks.build]
description = "Build the Debug configuration"
depends = ["generate"]
run = "xcodebuild -project Something.xcodeproj -scheme Something -configuration Debug -derivedDataPath $DERIVED_DATA_PATH build"

[tasks.build-release]
description = "Build the Release configuration"
depends = ["generate"]
run = "xcodebuild -project Something.xcodeproj -scheme Something -configuration Release -derivedDataPath $DERIVED_DATA_PATH build"

[tasks.run]
description = "Build and launch the Debug app"
depends = ["build"]
run = "open $DERIVED_DATA_PATH/Build/Products/Debug/Something.app"
