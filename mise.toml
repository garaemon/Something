[tools]
swiftlint = "0.65.1"
xcodegen = "2.46.0"

[env]
# Build into the repository so the run task can find the app at a fixed path.
DERIVED_DATA_PATH = "build"

[tasks.generate]
description = "Generate Something.xcodeproj from project.yml"
run = "xcodegen generate"

[tasks.build]
description = "Build the Debug configuration"
depends = ["generate"]
run = "xcodebuild -project Something.xcodeproj -scheme Something -configuration Debug -derivedDataPath $DERIVED_DATA_PATH build"

[tasks.build-release]
description = "Build the Release configuration"
depends = ["generate"]
run = "xcodebuild -project Something.xcodeproj -scheme Something -configuration Release -derivedDataPath $DERIVED_DATA_PATH build"

[tasks.run]
description = "Build and launch the Debug app"
depends = ["build"]
run = "open $DERIVED_DATA_PATH/Build/Products/Debug/Something.app"

[tasks.test]
description = "Run the unit tests"
depends = ["generate"]
run = "xcodebuild -project Something.xcodeproj -scheme Something -configuration Debug -derivedDataPath $DERIVED_DATA_PATH test"

[tasks.format]
description = "Format the app sources with swift-format"
run = "xcrun swift-format format --in-place --recursive Something"

[tasks.lint]
description = "Lint the app sources with swift-format and SwiftLint"
run = [
  "xcrun swift-format lint --strict --recursive Something",
  "swiftlint lint --strict",
]

[tasks.install-hooks]
description = "Run the linter on every commit through the Git hooks in .githooks"
run = "git config core.hooksPath .githooks"
