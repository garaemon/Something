[tools]
jq = "1.8.1"
shellcheck = "0.11.0"
swiftlint = "0.65.1"
xcodegen = "2.46.0"

[env]
# Build into the repository so the run task can find the app at a fixed path.
DERIVED_DATA_PATH = "build"

[tasks.generate]
description = "Generate Something.xcodeproj from project.yml"
run = "xcodegen generate"

[tasks.build]
description = "Build the Debug configuration"
depends = ["generate"]
run = "xcodebuild -project Something.xcodeproj -scheme Something -configuration Debug -derivedDataPath $DERIVED_DATA_PATH build"

[tasks.build-release]
description = "Build the Release configuration"
depends = ["generate"]
run = "xcodebuild -project Something.xcodeproj -scheme Something -configuration Release -derivedDataPath $DERIVED_DATA_PATH build"

[tasks.run]
description = "Build and launch the Debug app"
depends = ["build"]
run = "open $DERIVED_DATA_PATH/Build/Products/Debug/Something.app"

[tasks.test]
description = "Run the unit tests and keep the result bundle with code coverage"
depends = ["generate"]
# xcodebuild refuses to overwrite an existing result bundle.
run = [
  "rm -rf $DERIVED_DATA_PATH/Test.xcresult",
  "xcodebuild -project Something.xcodeproj -scheme Something -configuration Debug -derivedDataPath $DERIVED_DATA_PATH -resultBundlePath $DERIVED_DATA_PATH/Test.xcresult test",
]

[tasks.coverage]
description = "Print the code coverage of the last test run as Markdown"
run = "scripts/coverage-report.sh $DERIVED_DATA_PATH/Test.xcresult"

[tasks.format]
description = "Format the app sources with swift-format"
run = "xcrun swift-format format --in-place --recursive Something"

[tasks.lint]
description = "Lint the app sources with swift-format, SwiftLint, and closure-label-lint, and the shell scripts with ShellCheck"
# The Git hooks have no file extension, so .githooks is listed by path. Untracked
# scripts are included so that a new script fails before its first commit.
run = [
  "xcrun swift-format lint --strict --recursive Something",
  "swiftlint lint --strict",
  "git ls-files -z --cached --others --exclude-standard -- '*.sh' '*.bash' '.githooks/*' | xargs -0 shellcheck",
  "swift run --quiet --package-path Tools/ClosureLabelLint closure-label-lint Something",
]

[tasks.test-lint-tools]
description = "Run the unit tests of closure-label-lint"
run = "swift test --package-path Tools/ClosureLabelLint"

[tasks.install-hooks]
description = "Run the linter on every commit through the Git hooks in .githooks"
run = "git config core.hooksPath .githooks"
